name: Update profile assets

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-assets.yml"
      - "scripts/update_quote.py"

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate local GitHub statistics SVG
        uses: cicirello/user-statistician@v1
        with:
          image-file: assets/userstats.svg
          colors: dark
          custom-title: zintdev GitHub Activity
          include-title: true
          show-border: true
          animated-language-chart: true
          category-order: repositories, contributions, languages
          hide-keys: private
          locale: en
          commit-and-push: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rotate developer quote
        run: python scripts/update_quote.py

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/userstats.svg
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "chore: update profile stats and quote"
            git push
          fi
